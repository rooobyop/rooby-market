<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e0e17" />
<title>ROOBY Market</title>
<style>
  :root{
    --bg:#0e0e17;
    --bg-2:#15151f;
    --surface:#1c1c28;
    --surface-2:#23232f;
    --line:rgba(255,255,255,.07);
    --text:#f3f1f5;
    --dim:#a6a1b2;
    --faint:#6f6a7c;
    --gold:#e9c15f;
    --gold-2:#f5d98a;
    --gold-soft:rgba(233,193,95,.14);
    --violet:#8b6bff;
    --violet-soft:rgba(139,107,255,.14);
    --green:#4ade80;
    --red:#ff6b6b;
    --amber:#fbbf24;
    --radius:18px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --safe-b:env(safe-area-inset-bottom,0px);
    --nav-h:62px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(900px 500px at 100% -5%, rgba(139,107,255,.18), transparent 60%),
      radial-gradient(800px 500px at -10% 20%, rgba(233,193,95,.10), transparent 55%),
      var(--bg);
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }
  ::selection{background:var(--gold-soft)}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}

  .app{
    width:100%;max-width:480px;margin:0 auto;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;position:relative;
  }
  @media(min-width:520px){.app{min-height:min(900px,96vh);border-left:1px solid var(--line);border-right:1px solid var(--line)}}

  /* Header */
  header.topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:12px;
    padding:calc(14px + var(--safe-b)) 16px 12px;
    background:linear-gradient(180deg,rgba(14,14,23,.92),rgba(14,14,23,.7));
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{
    width:40px;height:40px;border-radius:12px;flex-shrink:0;
    display:grid;place-items:center;font-weight:800;font-size:16px;color:#1a1510;
    background:linear-gradient(135deg,#f5d98a,#c8933b);
    box-shadow:0 0 18px rgba(233,193,95,.35), inset 0 0 0 1px rgba(255,255,255,.35);
  }
  .brand h1{font-size:17px;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand h1 span{color:var(--gold)}
  .topbar .spacer{margin-left:auto}
  .icon-btn{
    width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--dim);font-size:18px;
    display:grid;place-items:center;flex-shrink:0;transition:transform .06s,background .15s;
  }
  .icon-btn:active{transform:scale(.93);background:var(--surface-2)}
  .icon-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .back-btn{display:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:20px;line-height:1;flex-shrink:0;align-items:center;justify-content:center}
  .back-btn.show{display:flex}

  /* Content */
  main.content{flex:1;overflow-y:auto;padding:16px 16px 0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
  main.content::-webkit-scrollbar{width:6px}
  main.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}

  .screen{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  [hidden]{display:none!important}

  .section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--faint);margin:20px 0 12px}
  .section-title:first-child{margin-top:4px}

  /* Greeting / hero */
  .hero{
    position:relative;overflow:hidden;
    border-radius:22px;padding:22px 20px;margin-bottom:4px;
    background:linear-gradient(140deg,rgba(139,107,255,.22),rgba(233,193,95,.10) 55%,rgba(14,14,23,.1));
    border:1px solid rgba(233,193,95,.22);
  }
  .hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 180deg at 50% 0%, rgba(233,193,95,.35), rgba(139,107,255,.28), rgba(74,222,128,.25), rgba(233,193,95,.35));
    opacity:.45;filter:blur(18px);mask:linear-gradient(#000,#0000 70%);
  }
  .hero h2{font-size:20px;font-weight:800;margin-bottom:6px;position:relative}
  .hero p{font-size:13.5px;color:var(--dim);line-height:1.5;position:relative;max-width:34ch}
  .hero .u{color:var(--gold-2);font-weight:700}

  .search{
    margin:16px 0 4px;position:relative;
  }
  .search input{
    width:100%;padding:13px 14px 13px 42px;border-radius:15px;
    background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:14.5px;outline:none;
  }
  .search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
  .search .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:16px;pointer-events:none}

  /* Category grid */
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cat-card{
    position:relative;border-radius:var(--radius);padding:16px 14px;
    background:var(--surface);border:1px solid var(--line);cursor:pointer;
    display:flex;flex-direction:column;gap:10px;min-height:98px;
    transition:transform .1s,background .15s,border-color .15s;overflow:hidden;
  }
  .cat-card:hover{background:var(--surface-2)}
  .cat-card:active{transform:scale(.97)}
  .cat-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .cat-card .ic{font-size:26px;line-height:1}
  .cat-card .nm{font-size:13.5px;font-weight:700;line-height:1.25}
  .cat-card::after{
    content:"";position:absolute;top:0;left:0;right:0;height:1.5px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5;
  }

  .cta-card{
    margin-top:12px;border-radius:var(--radius);padding:16px;
    background:linear-gradient(135deg,rgba(233,193,95,.16),rgba(139,107,255,.14));
    border:1px solid rgba(233,193,95,.28);
    display:flex;align-items:center;gap:14px;cursor:pointer;
    transition:transform .1s,box-shadow .15s;
  }
  .cta-card:hover{box-shadow:var(--shadow)}
  .cta-card:active{transform:scale(.98)}
  .cta-card .ic{font-size:28px}
  .cta-card .t{font-size:15px;font-weight:800}
  .cta-card .s{font-size:12.5px;color:var(--dim);margin-top:3px}
  .cta-card .go{margin-left:auto;color:var(--gold);font-size:20px}

  /* Generic card list */
  .list-card{
    display:flex;align-items:center;gap:14px;padding:14px;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;
  }
  .avatar{
    width:46px;height:46px;border-radius:13px;flex-shrink:0;
    display:grid;place-items:center;font-weight:800;font-size:16px;color:#1a1510;
    background:linear-gradient(135deg,#f5d98a,#c8933b);
  }
  .avatar.violet{background:linear-gradient(135deg,#b7a2ff,#6f52d8);color:#fff}
  .avatar.green{background:linear-gradient(135deg,#8bee9a,#2f9e5f);color:#0a1a10}
  .avatar.ghost{background:var(--surface-2);color:var(--dim)}
  .list-card .info{flex:1;min-width:0}
  .list-card .info .t{font-size:14.5px;font-weight:700}
  .list-card .info .s{font-size:12.5px;color:var(--dim);margin-top:2px}
  .list-card .price{font-size:14px;font-weight:800;color:var(--gold-2);white-space:nowrap}
  .list-card .price small{color:var(--dim);font-weight:500}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 16px;border-radius:14px;border:none;font-size:14px;font-weight:700;
    background:var(--surface-2);color:var(--text);transition:transform .06s,opacity .15s,filter .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .btn.block{width:100%}
  .btn.primary{
    background:linear-gradient(135deg,#f5d98a,#c8933b);color:#1a1510;
    box-shadow:0 8px 20px rgba(233,193,95,.28);
  }
  .btn.violet{background:linear-gradient(135deg,#9d81ff,#6f52d8);color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.small{padding:8px 12px;font-size:12.5px;border-radius:11px}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.3)}

  .btn-row{display:flex;gap:10px;margin-top:14px}
  .btn-row .btn{flex:1}

  /* Empty state */
  .empty{
    text-align:center;padding:44px 20px;color:var(--faint);
  }
  .empty .ic{font-size:40px;margin-bottom:12px;opacity:.7}
  .empty .t{font-size:15px;font-weight:700;color:var(--dim)}
  .empty .s{font-size:12.5px;margin-top:4px}

  /* Forms */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--dim);margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%;padding:12px 14px;border-radius:13px;font-size:14.5px;color:var(--text);
    background:var(--surface);border:1px solid var(--line);outline:none;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
  .field textarea{min-height:92px;resize:vertical}
  .field .hint{font-size:11.5px;color:var(--faint);margin-top:5px}
  .field .err{font-size:12px;color:var(--red);margin-top:5px;display:none}
  .field.has-err .err{display:block}
  .field.has-err input{border-color:var(--red)}

  /* Badges & chips */
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
  .chip.gold{background:var(--gold-soft);color:var(--gold-2);border:1px solid rgba(233,193,95,.25)}
  .chip.violet{background:var(--violet-soft);color:#c0adff;border:1px solid rgba(139,107,255,.25)}
  .chip.green{background:rgba(74,222,128,.12);color:var(--green);border:1px solid rgba(74,222,128,.25)}
  .chip.red{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.25)}
  .chip.amber{background:rgba(251,191,36,.12);color:var(--amber);border:1px solid rgba(251,191,36,.25)}
  .chip.muted{background:var(--surface-2);color:var(--dim);border:1px solid var(--line)}

  .note{
    margin-top:10px;padding:12px 14px;border-radius:14px;font-size:12.5px;line-height:1.5;color:var(--dim);
    background:var(--surface);border:1px dashed var(--line);
  }
  .note strong{color:var(--text)}
  .note.warn{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.06)}

  /* Segmented / filter */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips .chip{cursor:pointer;white-space:nowrap;flex-shrink:0}
  .chips .chip.active{background:var(--gold-soft);color:var(--gold-2);border-color:var(--gold)}

  /* Steps */
  .steps{display:flex;gap:8px;margin-bottom:18px}
  .step{flex:1;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .step.on{background:linear-gradient(90deg,var(--gold),var(--violet))}

  /* Fee summary */
  .fee-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:6px}
  .fee-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px}
  .fee-row .lbl{color:var(--dim)}
  .fee-row .val{font-weight:700}
  .fee-row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
  .fee-row.total .val{color:var(--gold-2);font-size:16px}

  /* Modals */
  .modal-backdrop{
    position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
    display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease;
  }
  @media(min-width:520px){.modal-backdrop{align-items:center}}
  .modal{
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    background:var(--bg-2);border:1px solid var(--line);border-radius:22px 22px 0 0;
    padding:20px 18px calc(20px + var(--safe-b));animation:slide .24s ease;
  }
  @media(min-width:520px){.modal{border-radius:22px}}
  @keyframes slide{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .modal .m-title{font-size:17px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
  .modal .m-close{width:32px;height:32px;border-radius:10px;border:none;background:var(--surface);color:var(--dim);font-size:16px}
  .modal .m-sub{font-size:13px;color:var(--dim);margin-bottom:16px;line-height:1.5}

  /* Toasts */
  .toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + var(--safe-b));z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
  .toast{
    background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
    padding:12px 16px;font-size:13.5px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:10px;animation:slide .22s ease;
  }
  .toast .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}

  /* Bottom nav */
  nav.bottom{
    flex-shrink:0;display:flex;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
    background:rgba(15,15,22,.88);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  }
  .nav-btn{
    flex:1;background:none;border:none;color:var(--faint);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:11px;font-weight:600;position:relative;
    transition:color .15s;
  }
  .nav-btn .ic{font-size:22px;line-height:1;filter:grayscale(.4);opacity:.75}
  .nav-btn.active{color:var(--gold-2)}
  .nav-btn.active .ic{filter:none;opacity:1;transform:translateY(-1px)}
  .nav-btn.active::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 99px 99px;background:linear-gradient(90deg,var(--gold),var(--violet))}
  .nav-btn:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

  /* Admin login page */
  .admin-wrap{min-height:100vh;max-width:480px;margin:0 auto;padding:0 16px 30px}
  .admin-wrap header{padding-top:40px;text-align:center;margin-bottom:28px}
  .admin-wrap header .logo{margin:0 auto 14px}
  .admin-wrap header h1{font-size:22px;font-weight:800}
  .admin-wrap header p{color:var(--dim);font-size:13px;margin-top:6px}
  .admin-login{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}

  .admin-dash{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .admin-card{
    border-radius:16px;padding:16px;background:var(--surface);border:1px solid var(--line);
    cursor:pointer;transition:transform .1s,background .15s;
  }
  .admin-card:active{transform:scale(.97)}
  .admin-card .ic{font-size:24px;margin-bottom:8px}
  .admin-card .t{font-size:14px;font-weight:700}
  .admin-card .s{font-size:11.5px;color:var(--dim);margin-top:3px}

  .admin-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
  .admin-item .info{flex:1;min-width:0}
  .admin-item .info .t{font-size:14px;font-weight:700}
  .admin-item .info .s{font-size:12px;color:var(--dim);margin-top:2px}
  .admin-item .acts{display:flex;gap:6px}
  .mini-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--dim);font-size:15px;display:grid;place-items:center}
  .mini-btn.danger:active{background:rgba(255,107,107,.18);color:var(--red)}
</style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar">
      <button class="back-btn" id="backBtn" aria-label="Назад">‹</button>
      <div class="brand">
        <div class="logo">R</div>
        <h1>ROOBY<span> Market</span></h1>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="headerAction" aria-label="Действие" style="display:none">⋯</button>
    </header>

    <main class="content" id="content">
      <!-- ============ HOME ============ -->
      <section class="screen" id="screen-home"></section>

      <!-- ============ ORDERS ============ -->
      <section class="screen" id="screen-orders" hidden></section>

      <!-- ============ CREATE ============ -->
      <section class="screen" id="screen-create" hidden></section>

      <!-- ============ PROFILE ============ -->
      <section class="screen" id="screen-profile" hidden></section>

      <!-- ============ DRAWING ============ -->
      <section class="screen" id="screen-drawing" hidden></section>

      <!-- ============ GUARANTOR ============ -->
      <section class="screen" id="screen-guarantor" hidden></section>

      <!-- ============ MANUALS ============ -->
      <section class="screen" id="screen-manuals" hidden></section>

      <!-- ============ EDUCATION ============ -->
      <section class="screen" id="screen-education" hidden></section>

      <!-- ============ PLATFORMS ============ -->
      <section class="screen" id="screen-platforms" hidden></section>

      <!-- ============ DROPOVODS ============ -->
      <section class="screen" id="screen-dropovods" hidden></section>
    </main>

    <nav class="bottom" id="bottomnav">
      <button class="nav-btn active" data-nav="home"><span class="ic">🏠</span>Главная</button>
      <button class="nav-btn" data-nav="orders"><span class="ic">📦</span>Мои заказы</button>
      <button class="nav-btn" data-nav="create"><span class="ic">➕</span>Создать</button>
      <button class="nav-btn" data-nav="profile"><span class="ic">👤</span>Профиль</button>
    </nav>
  </div>

  <!-- Admin panel (separate, reached via #admin) -->
  <div id="adminPanel" style="display:none"></div>

  <div class="toasts" id="toasts"></div>
  <div id="modalRoot"></div>

<script>
/* =====================================================================
   ROOBY Market — frontend demo. No backend, no real payments, no secrets.
   Data is demo-only and stored in localStorage solely to illustrate UX.
   ===================================================================== */

/* ---------- Telegram WebApp SDK ---------- */
(function(){
  const url = 'https://telegram.org/js/telegram-web-app.js';
  const s = document.createElement('script');
  s.async = true; s.src = url;
  document.head.appendChild(s);
})();

function getTgUser(){
  try{
    const u = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user);
    if(u){
      return {
        id: u.id,
        username: u.username || null,
        first: u.first_name || 'Пользователь',
        source: 'telegram'
      };
    }
  }catch(e){}
  // Demo fallback when not running inside Telegram
  return { id: '123456789', username: 'demo_user', first: 'Демо Пользователь', source: 'demo' };
}

const USER = getTgUser();

/* ---------- Default demo state ---------- */
function defaults(){
  return {
    adminLogged: { in: false, login: 'admin', pass: 'demo' }, // demo only — not real auth
    manualAccess: false,
    activatedCode: null,
    demoCode: 'ROOBY-DEMO',

    support: 'rooby_support',       // demo contact
    drawingContact: 'rooby_draw',   // demo contact
    trainingContact: 'rooby_mentor',// demo contact
    drawingPrice: '3 000 ₽',
    directRosplatLink: '',          // admin sets it; empty -> "Ссылка скоро появится"

    teamLeads: [
      { id:'tl1', name:'Алексей', username:'rooby_tl_alex', spec:'Т-Банк', bio:'Специализация — обучение и подключение по Т-Банку. Описание и опыт редактируются администратором. (демо)' },
      { id:'tl2', name:'Мария', username:'rooby_tl_maria', spec:'Маркетплейсы', bio:'Специализация — маркетплейсы и дроп-схемы. Информация обновляется администратором. (демо)' },
      { id:'tl3', name:'Дмитрий', username:'rooby_tl_dima', spec:'Гарант + документооборот', bio:'Специализация — сопровождение сделок. (демо)' }
    ],
    guarantors: [
      { id:'g1', name:'Гарант ROOBY', username:'rooby_guarantor', assigned:true },
      { id:'g2', name:'Резервный гарант', username:'rooby_guarantor_2', assigned:false }
    ],

const LS_KEY = 'rooby_market_state_v1';
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const d = defaults();
      for(const k in d){ if(!(k in parsed)) parsed[k] = d[k]; }
      return parsed;
    }
  }catch(e){}
  return defaults();
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  // Note: localStorage is NOT a database / not secure / no cross-device sync.
}

/* ---------- Helpers ---------- */
const $ = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Number(n||0).toLocaleString('ru-RU'); }
function monogram(name){
  const w = String(name).trim().split(/\s+/);
  if(w.length===1) return w[0].slice(0,2).toUpperCase();
  return (w[0][0]+w[1][0]).toUpperCase();
}
function isTgUsername(u){ return !!u && /^[a-zA-Z][a-zA-Z0-9_]{3,31}$/.test(u); }
function tgLink(u){ return isTgUsername(u) ? 'https://t.me/'+u : null; }

let toastTimer = [];
function toast(msg){
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span class="dot"></span><span>'+esc(msg)+'</span>';
  box.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* Generic contact open — opens Telegram only if username looks valid */
function openContact(username, label){
  const link = tgLink(username);
  if(link){
    // safe external link via rel/noopener
    const a = document.createElement('a');
    a.href = link; a.target = '_blank'; a.rel = 'noopener noreferrer';
    document.body.appendChild(a); a.click(); a.remove();
  } else {
    toast(label || 'Контакт пока не настроен');
  }
}

/* ---------- Modal ---------- */
function openModal(html){
  const root = $('#modalRoot');
  root.innerHTML = '<div class="modal-backdrop" data-close><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';
  root.querySelector('.modal-backdrop').addEventListener('click', e => {
    if(e.target.dataset.close || e.target.classList.contains('modal-backdrop')) closeModal();
  });
  $$('.m-close', root).forEach(b => b.addEventListener('click', closeModal));
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeModal(); } });

/* ---------- Navigation ---------- */
const NAV = { home:'screen-home', orders:'screen-orders', create:'screen-create', profile:'screen-profile' };
const SUB = ['screen-drawing','screen-guarantor','screen-manuals','screen-education','screen-platforms','screen-dropovods'];

let current = 'screen-home';
const stack = [];

function showScreen(id){
  $$('.screen').forEach(s => s.hidden = true);
  const el = $('#'+id);
  if(el) el.hidden = false;
  current = id;

  const isSub = SUB.includes(id);
  $('#backBtn').classList.toggle('show', isSub);
  $('#bottomnav').style.display = isSub ? 'none' : 'flex';

  // highlight nav
  const navId = Object.keys(NAV).find(k => NAV[k]===id);
  $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === navId));

  $('#content').scrollTop = 0;
  render(id);
}

function go(id){ stack.push(current); showScreen(id); }
function back(){
  if(stack.length){ showScreen(stack.pop()); }
  else showScreen('screen-home');
}

$('#backBtn').addEventListener('click', back);

$$('.nav-btn').forEach(b => b.addEventListener('click', () => {
  showScreen(NAV[b.dataset.nav]);
}));

}

  const el = $('#screen-dropovods');

    let body;

      body = contacts.map(c =>
        '<div class="list-card">'+

      '<button class="btn ghost small" style="margin-bottom:12px" id="dropBack">‹ Все города</button>'+

  } else {
    const cities = state.cities.filter(c => !dropQuery || c.toLowerCase().includes(dropQuery.toLowerCase()));
    const list = cities.length
      ? cities.map(c => {
          const contacts = state.dropovods[c] || [];

            '<div class="avatar ghost">🏙️</div>'+

            '<span style="color:var(--faint);font-size:18px">›</span>'+
          '</div>';
        }).join('')
      : '<div class="empty"><div class="ic">🔍</div><div class="t">Город не найден</div></div>';

      list;
  }

  el.innerHTML = cityHtml;

  if(backBtn) backBtn.addEventListener('click', () => { dropCity = null; renderDropovods(); });

  const ds = $('#dropSearch');
  if(ds) ds.addEventListener('input', e => { dropQuery = e.target.value; renderDropovods(); $('#dropSearch').focus(); });

  $$('#screen-dropovods [data-city]').forEach(elm => {

  });

  $$('#screen-dropovods [data-drop-write]').forEach(b => b.addEventListener('click', () => openContact(b.dataset.dropWrite, 'Контакт пока не настроен')));
}

function statusChip(s){

}

    '<div class="field"><label for="crCat">Категория</label>'+
      '<select id="crCat">'+opts.map(c => '<option value="'+c.id+'">'+c.ic+' '+esc(c.nm)+'</option>').join('')+'</select>'+
    '</div>'+
    '<div class="field"><label for="crTitle">Название</label><input type="text" id="crTitle" placeholder="Название услуги или материала"></div>'+
    '<div class="field"><label for="crDesc">Описание</label><textarea id="crDesc" placeholder="Краткое описание"></textarea></div>'+
    '<div class="field"><label for="crPrice">Цена, ₽</label><input type="number" id="crPrice" inputmode="numeric" min="0" placeholder="Например, 3 000"></div>'+
    '<div class="field"><label for="crImg">Обложка (изображение)</label>'+
      '<input type="file" id="crImg" accept="image/*" style="padding:10px" aria-label="Обложка">'+
      '<div class="hint">Загрузка — визуальная демонстрация, файл никуда не отправляется.</div>'+
    '</div>'+
    '<button class="btn primary block" id="crSubmit" style="margin-top:6px">Отправить на модерацию</button>'+
    '<div class="note" style="margin-top:14px">Раздел «Гарант» здесь недоступен — каталог гарантов курирует администратор.</div>';

  $('#crSubmit').addEventListener('click', () => {
    const title = $('#crTitle').value.trim();
    const desc = $('#crDesc').value.trim();
    const price = $('#crPrice').value.trim();
    if(!title){ fieldErr($('#crTitle'), true); toast('Укажите название'); return; }
    const id = 'm' + Date.now();
    state.moderation.unshift({ id, title, desc: desc || '—', price: (price? fmt(price)+' ₽' : '—'), status:'pending', category: $('#crCat').value });
    saveState();
    $('#crTitle').value=''; $('#crDesc').value=''; $('#crPrice').value=''; $('#crImg').value='';
    toast('Демо-заявка отправлена на модерацию');
  });

  const titleInput = $('#crTitle'); if(titleInput) titleInput.addEventListener('input', () => fieldErr(titleInput, false));
}
function fieldErr(input, on){
  if(!input) return;
  const f = input.closest('.field');
  if(f) f.classList.toggle('has-err', on);
}

    exitAdmin();
  });
  $$('#adminPanel [data-admin]').forEach(c => {
    c.addEventListener('click', () => openAdminSection(c.dataset.admin));
    c.addEventListener('keydown', e => { if(e.key==='Enter') openAdminSection(c.dataset.admin); });
  });
}

function adminHeader(title){
  return '<button class="btn ghost small" style="margin-bottom:14px" id="admBack">‹ Назад</button>'+
         '<div class="section-title">'+title+'</div>';
}

function openAdminSection(id){
  const root = $('#adminPanel');
  let html = '<div class="admin-wrap">';

  if(id === 'tl'){
    html += adminHeader('Team Lead');
    html += state.teamLeads.map(t =>
      '<div class="admin-item">'+
        '<div class="avatar violet">'+monogram(t.name)+'</div>'+
        '<div class="info"><div class="t">'+esc(t.name)+'</div><div class="s">@'+esc(t.username)+' · '+esc(t.spec)+'</div></div>'+
        '<div class="acts">'+
          '<button class="mini-btn" data-edit="tl" data-id="'+t.id+'" title="Изменить">✎</button>'+
          '<button class="mini-btn danger" data-del="tl" data-id="'+t.id+'" title="Удалить">✕</button>'+
        '</div>'+
      '</div>').join('');
    html += '<button class="btn block" id="admAddTl">＋ Добавить Team Lead</button>';
  }
  else if(id === 'guar'){
    html += adminHeader('Гаранты');
    html += state.guarantors.map(g =>
      '<div class="admin-item">'+
        '<div class="avatar">'+monogram(g.name)+'</div>'+
        '<div class="info"><div class="t">'+esc(g.name)+(g.assigned?' <span class="chip green">назначен</span>':'')+'</div>'+
        '<div class="s">@'+esc(g.username)+'</div></div>'+
        '<div class="acts">'+
          '<button class="mini-btn" data-assign="'+g.id+'" title="Назначить за сделку">⭐</button>'+
          '<button class="mini-btn" data-edit="guar" data-id="'+g.id+'" title="Изменить">✎</button>'+
          '<button class="mini-btn danger" data-del="guar" data-id="'+g.id+'" title="Удалить">✕</button>'+
        '</div>'+
      '</div>').join('');
    html += '<button class="btn block" id="admAddGuar">＋ Добавить гаранта</button>';
  }
  else if(id === 'drop'){
    html += adminHeader('Дроповоды');
    html += state.cities.map(city => {
      const cs = state.dropovods[city] || [];
      return '<div class="admin-item" style="flex-direction:column;align-items:stretch">'+
        '<div style="display:flex;align-items:center;gap:12px">'+
          '<span style="font-weight:700;flex:1">'+esc(city)+' <span class="chip muted">'+cs.length+'</span></span>'+
          '<button class="btn small ghost" data-drop-add="'+esc(city)+'">＋ контакт</button>'+
        '</div>'+
        cs.map(c =>
          '<div class="admin-item" style="margin:8px 0 0;background:var(--surface-2)">'+
            '<div class="info"><div class="t" style="font-size:13px">'+esc(c.name)+'</div><div class="s">@'+esc(c.username)+'</div></div>'+
            '<div class="acts">'+
              '<button class="mini-btn" data-edit="dropc" data-city="'+esc(city)+'" data-id="'+c.id+'" title="Изменить">✎</button>'+
              '<button class="mini-btn danger" data-del="dropc" data-city="'+esc(city)+'" data-id="'+c.id+'" title="Удалить">✕</button>'+
            '</div>'+
          '</div>').join('')+
      '</div>';
    }).join('');
    html += '<div class="note" style="margin-top:12px">Города добавляются/удаляются в разделе «Категории» → города (в перспективе). В этой демо-версии — редактирование контактов.</div>';
  }
  else if(id === 'links'){
    html += adminHeader('Ссылки');
    html += '<div class="field"><label for="admRosplatLink">Ссылка прямого подключения к Rosplat</label>'+
      '<input type="url" id="admRosplatLink" value="'+esc(state.directRosplatLink)+'" placeholder="https://example.com/register">'+
      '<div class="hint">Только http/https. Пустое поле — показывается «Ссылка скоро появится».</div></div>'+
      '<button class="btn primary block" id="admSaveLink">Сохранить</button>'+
      '<div class="note" style="margin-top:12px">В будущем сюда добавятся другие площадки.</div>';
  }
  else if(id === 'codes'){
    html += adminHeader('Коды доступа');
    html += state.accessCodes.map(c =>
      '<div class="admin-item">'+
        '<div class="avatar ghost">🔑</div>'+
        '<div class="info"><div class="t">'+esc(c.code)+'</div><div class="s">'+(c.used?'Использован':'Не использован')+'</div></div>'+
        (c.used ? '<span class="chip red">использован</span>' : '<span class="chip green">свободен</span>')+
        '<button class="mini-btn danger" data-delcode="'+esc(c.code)+'" title="Удалить" style="margin-left:8px">✕</button>'+
      '</div>').join('');
    html += '<div class="btn-row" style="margin-top:12px"><button class="btn block" id="admGenCode">＋ Создать код</button></div>';
    html += '<div class="note warn">Одноразовые коды — демонстрация. Настоящая проверка возможна только на сервере.</div>';
  }
  else if(id === 'manuals'){
    html += adminHeader('Мануалы');
    html += state.manuals.map(m =>
      '<div class="admin-item">'+
        '<div class="avatar ghost">'+monogram(m.name)+'</div>'+
        '<div class="info"><div class="t">'+esc(m.name)+'</div><div class="s">'+(m.ready?'Материалы доступны':'Материалы скоро появятся')+'</div></div>'+
        '<button class="mini-btn" data-manual-toggle="'+esc(m.name)+'" title="Переключить доступность">'+(m.ready?'✓':'○')+'</button>'+
      '</div>').join('');
  }
  else if(id === 'edu'){
    html += adminHeader('Обучение');
    html += '<div class="field"><label for="admEduContact">Общий Telegram-контакт (ник без @)</label>'+
      '<input type="text" id="admEduContact" value="'+esc(state.trainingContact)+'"></div>';
    html += state.tariffs.map(t =>
      '<div class="admin-item">'+
        '<div class="info"><div class="t">'+esc(t.title)+'</div><div class="s">'+esc(t.price)+'</div></div>'+
        '<button class="mini-btn" data-edit="tariff" data-id="'+t.id+'" title="Изменить">✎</button>'+
      '</div>').join('');
    html += '<button class="btn block" id="admSaveEdu" style="margin-top:12px">Сохранить контакт</button>';
  }
  else if(id === 'draw'){
    html += adminHeader('Отрисовка');
    html += '<div class="field"><label for="admDrawPrice">Цена, ₽</label><input type="text" id="admDrawPrice" value="'+esc(state.drawingPrice)+'"></div>'+
      '<div class="field"><label for="admDrawContact">Telegram-контакт (ник без @)</label><input type="text" id="admDrawContact" value="'+esc(state.drawingContact)+'"></div>'+
      '<button class="btn primary block" id="admSaveDraw">Сохранить</button>'+
      '<div class="note">Отрисовка — карточка услуги с ценой и контактом. Содержание услуги администратор задаёт отдельно и законно.</div>';
  }
  else if(id === 'support'){
    html += adminHeader('Поддержка');
    html += '<div class="field"><label for="admSupport">Общий Telegram-контакт (ник без @)</label>'+
      '<input type="text" id="admSupport" value="'+esc(state.support)+'"></div>'+
      '<button class="btn primary block" id="admSaveSupport">Сохранить</button>';
  }
  else if(id === 'mod'){
    html += adminHeader('Модерация');
    if(!state.moderation.length){
      html += '<div class="empty"><div class="ic">📭</div><div class="t">Нет заявок</div></div>';
    } else {
      html += state.moderation.map(m =>
        '<div class="admin-item" style="flex-direction:column;align-items:stretch">'+
          '<div style="display:flex;align-items:center;gap:12px">'+
            '<div class="avatar ghost">'+monogram(m.title)+'</div>'+
            '<div class="info"><div class="t">'+esc(m.title)+'</div>'+
            '<div class="s">'+esc(m.desc)+' · '+esc(m.price)+'</div></div>'+
            (m.status==='pending'?'<span class="chip amber">на рассмотрении</span>': m.status==='approved'?'<span class="chip green">одобрено</span>':'<span class="chip red">отклонено</span>')+
          '</div>'+
          (m.status==='pending' ?
            '<div class="btn-row" style="margin-top:10px">'+
              '<button class="btn small ghost" data-mod-ok="'+m.id+'">✓ Одобрить</button>'+
              '<button class="btn small ghost" data-mod-no="'+m.id+'">✕ Отклонить</button>'+
            '</div>' : '')+
        '</div>').join('');
    }
  }
  else if(id === 'cats'){
    html += adminHeader('Категории');
    html += CATEGORIES.map(c =>
      '<div class="admin-item">'+
        '<div class="avatar ghost">'+c.ic+'</div>'+
        '<div class="info"><div class="t">'+esc(c.nm)+'</div><div class="s">'+(c.id==='guarantor'?'курирует администратор':'')+'</div></div>'+
        '<button class="mini-btn" data-cat-toggle="'+c.id+'" title="Видимость">'+(state.categories[c.id].visible?'👁':'🚫')+'</button>'+
      '</div>').join('');
  }

  html += '</div>';
  root.innerHTML = html;

  bindAdmin(id);

  const backBtn = $('#admBack');
  if(backBtn) backBtn.addEventListener('click', () => renderAdmin());
}

function bindAdmin(section){
  const root = $('#adminPanel');

  if(section === 'tl'){
    $('#admAddTl').addEventListener('click', () => {
      openModal(editableForm('tladd', {label:'Добавить Team Lead', fields:{name:'Имя', username:'Ник (без @)', spec:'Специализация', bio:'Описание (textarea)'}}));
    });
  }
  if(section === 'guar'){
    $('#admAddGuar').addEventListener('click', () => {
      openModal(editableForm('guaradd', {label:'Добавить гаранта', fields:{name:'Имя', username:'Ник (без @)'}}));
    });
  }
  if(section === 'links'){
    $('#admSaveLink').addEventListener('click', () => {
      const v = $('#admRosplatLink').value.trim();
      if(v && !/^https?:\/\//.test(v)){ toast('Ссылка должна начинаться с http:// или https://'); return; }
      state.directRosplatLink = v; saveState(); toast('Ссылка сохранена (демо)');
    });
  }
  if(section === 'codes'){
    $('#admGenCode').addEventListener('click', () => {
      const code = 'RB' + Math.random().toString(36).slice(2,8).toUpperCase();
      state.accessCodes.push({ code, used:false }); saveState();
      toast('Код '+code+' создан'); openAdminSection('codes');
    });
  }
  if(section === 'edu'){
    $('#admSaveEdu').addEventListener('click', () => {
      state.trainingContact = $('#admEduContact').value.trim().replace(/^@/,''); saveState(); toast('Контакт сохранён');
    });
  }
  if(section === 'draw'){
    $('#admSaveDraw').addEventListener('click', () => {
      state.drawingPrice = $('#admDrawPrice').value.trim();
      state.drawingContact = $('#admDrawContact').value.trim().replace(/^@/,''); saveState(); toast('Сохранено');
    });
  }
  if(section === 'support'){
    $('#admSaveSupport').addEventListener('click', () => {
      state.support = $('#admSupport').value.trim().replace(/^@/,''); saveState(); toast('Контакт поддержки сохранён');
    });
  }

  // Edit buttons
  $$('#adminPanel [data-edit]').forEach(b => b.addEventListener('click', () => {
    const kind = b.dataset.edit;
    if(kind==='tl'){
      const t = state.teamLeads.find(x=>x.id===b.dataset.id);
      openModal(editableForm('tledit', {id:t.id, label:'Изменить Team Lead', fields:{name:t.name, username:t.username, spec:t.spec, bio:t.bio, bioArea:true}}));
    } else if(kind==='guar'){
      const g = state.guarantors.find(x=>x.id===b.dataset.id);
      openModal(editableForm('guaredit', {id:g.id, label:'Изменить гаранта', fields:{name:g.name, username:g.username}}));
    } else if(kind==='dropc'){
      const city = b.dataset.city;
      const arr = state.dropovods[city] || [];
      const c = arr.find(x=>x.id===b.dataset.id);
      openModal(editableForm('dropcedit', {id:c.id, city, label:'Изменить контакт', fields:{name:c.name, username:c.username, desc:c.desc, descArea:true}}));
    } else if(kind==='tariff'){
      const t = state.tariffs.find(x=>x.id===b.dataset.id);
      openModal(editableForm('tariffedit', {id:t.id, label:'Изменить тариф', fields:{title:t.title, price:t.price, tag:t.tag, desc:t.desc, descArea:true}}));
    }
  }));

  // Delete buttons
  $$('#adminPanel [data-del]').forEach(b => b.addEventListener('click', () => {
    if(!confirm('Удалить эту демо-запись?')) return;
    const kind = b.dataset.del;
    if(kind==='tl'){ state.teamLeads = state.teamLeads.filter(x=>x.id!==b.dataset.id); }
    else if(kind==='guar'){ state.guarantors = state.guarantors.filter(x=>x.id!==b.dataset.id); }
    else if(kind==='dropc'){
      const city = b.dataset.city;
      if(state.dropovods[city]) state.dropovods[city] = state.dropovods[city].filter(x=>x.id!==b.dataset.id);
    }
    saveState(); openAdminSection(section);
  }));

  // Assign guarantor
  $$('#adminPanel [data-assign]').forEach(b => b.addEventListener('click', () => {
    state.guarantors.forEach(g => g.assigned = (g.id===b.dataset.assign));
    saveState(); toast('Гарант назначен (демо)'); openAdminSection('guar');
  }));

  // Dropovod add contact
  $$('#adminPanel [data-drop-add]').forEach(b => b.addEventListener('click', () => {
    const city = b.dataset.dropAdd;
    openModal(editableForm('dropcadd', {city, label:'Добавить контакт в «'+city+'»', fields:{name:'Имя', username:'Ник (без @)', desc:'Описание (textarea)', descArea:true}}));
  }));

  // Delete code
  $$('#adminPanel [data-delcode]').forEach(b => b.addEventListener('click', () => {
    if(!confirm('Удалить код?')) return;
    state.accessCodes = state.accessCodes.filter(c=>c.code!==b.dataset.delcode);
    saveState(); openAdminSection('codes');
  }));

  // Manual toggle
  $$('#adminPanel [data-manual-toggle]').forEach(b => b.addEventListener('click', () => {
    const m = state.manuals.find(x=>x.name===b.dataset.manualToggle);
    m.ready = !m.ready; saveState(); openAdminSection('manuals');
  }));

  // Moderation
  $$('#adminPanel [data-mod-ok]').forEach(b => b.addEventListener('click', () => {
    const m = state.moderation.find(x=>x.id===b.dataset.modOk); m.status='approved'; saveState(); openAdminSection('mod');
  }));
  $$('#adminPanel [data-mod-no]').forEach(b => b.addEventListener('click', () => {
    const m = state.moderation.find(x=>x.id===b.dataset.modNo); m.status='rejected'; saveState(); openAdminSection('mod');
  }));

  // Category toggle
  $$('#adminPanel [data-cat-toggle]').forEach(b => b.addEventListener('click', () => {
    const c = state.categories[b.dataset.catToggle]; c.visible = !c.visible; saveState(); openAdminSection('cats');
  }));
}

function editableForm(mode, opts){
  const f = opts.fields || {};
  const keys = Object.keys(f);
  const isEdit = /edit$/.test(mode) || mode==='tledit' || mode==='guaredit' || mode==='dropcedit' || mode==='tariffedit';

  const fieldHtml = keys.map(k => {
    const val = f[k];
    const isArea = k==='bio' || k==='desc';
    const label = k==='bio' ? 'Описание' : k==='desc' ? 'Описание' : k[0].toUpperCase()+k.slice(1);
    if(isArea) return '<div class="field"><label>'+label+'</label><textarea id="ef_'+k+'" placeholder="'+label+'">'+esc(val)+'</textarea></div>';
    return '<div class="field"><label>'+label+'</label><input type="text" id="ef_'+k+'" value="'+esc(val)+'"></div>';
  }).join('');

  openModal(
    '<div class="m-title">'+esc(opts.label)+'<button class="m-close">✕</button></div>'+
    fieldHtml +
    '<button class="btn primary block" id="efSave">Сохранить</button>'
  );

  $('#efSave').addEventListener('click', () => {
    const vals = {};
    keys.forEach(k => { vals[k] = $('#ef_'+k).value.trim(); });
    if(!vals.name && 'name' in f){ toast('Укажите имя'); return; }
    applyForm(mode, opts, vals);
  });
}

function applyForm(mode, opts, vals){
  if(mode==='tladd'){
    if(!vals.name || !vals.username){ toast('Заполните имя и ник'); return; }
    state.teamLeads.push({ id:'tl'+Date.now(), name:vals.name, username:vals.username.replace(/^@/,''), spec:vals.spec||'—', bio:vals.bio||'—' });
  } else if(mode==='tledit'){
    const t = state.teamLeads.find(x=>x.id===opts.id);
    t.name=vals.name; t.username=vals.username.replace(/^@/,''); t.spec=vals.spec; t.bio=vals.bio;
  } else if(mode==='guaradd'){
    if(!vals.name || !vals.username){ toast('Заполните имя и ник'); return; }
    state.guarantors.push({ id:'g'+Date.now(), name:vals.name, username:vals.username.replace(/^@/,''), assigned:false });
  } else if(mode==='guaredit'){
    const g = state.guarantors.find(x=>x.id===opts.id); g.name=vals.name; g.username=vals.username.replace(/^@/,'');
  } else if(mode==='dropcadd'){
    if(!vals.name || !vals.username){ toast('Заполните имя и ник'); return; }
    if(!state.dropovods[opts.city]) state.dropovods[opts.city] = [];
    state.dropovods[opts.city].push({ id:'d'+Date.now(), name:vals.name, username:vals.username.replace(/^@/,''), desc:vals.desc||'—' });
  } else if(mode==='dropcedit'){
    const arr = state.dropovods[opts.city] || [];
    const c = arr.find(x=>x.id===opts.id);
    if(c){ c.name=vals.name; c.username=vals.username.replace(/^@/,''); c.desc=vals.desc; }
  } else if(mode==='tariffedit'){
    const t = state.tariffs.find(x=>x.id===opts.id);
    t.title=vals.title; t.price=vals.price; t.tag=vals.tag; t.desc=vals.desc;
  }
  saveState(); closeModal(); toast('Сохранено (демо)');
  // re-open current admin section
  const active = state; // no-op to keep flow simple; re-render dashboard
  renderAdmin();
}

/* ---------- Admin routing via hash ---------- */
function enterAdmin(){ renderAdmin(); }
function exitAdmin(){
  $('#adminPanel').style.display = 'none';
  $('#adminPanel').innerHTML = '';
  $('#app').style.display = 'flex';
  if(location.hash === '#admin'){ history.replaceState(null,'',location.pathname+location.search); }
  showScreen('screen-home');
}

function handleHash(){
  if(location.hash === '#admin'){
    enterAdmin();
  } else {
    exitAdmin();
  }
}
window.addEventListener('hashchange', handleHash);

/* ---------- Init ---------- */
function init(){
  // header action button currently unused (kept for future)
  showScreen('screen-home');
  if(location.hash === '#admin'){ enterAdmin(); }

  if(window.Telegram && Telegram.WebApp){
    try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(e){}
  }
}

init();
</script>
